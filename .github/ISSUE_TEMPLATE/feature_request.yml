name: Feature request
description: Suggest an improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or awkward today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Import (GitHub / folder / ZIP)
        - Export (HTML / JSON / Python)
        - AI text format
        - i18n
        - Themes / layout
        - Accessibility
        - Docs
        - Other
    validations:
      required: true
